# .github/workflows/coderabbit.yml
name: code-review
on:
  pull_request:

jobs:
  code_review:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v3

      - name: Run CodeRabbit AI Review
        uses: coderabbitai/ai-pr-reviewer@main
        with:
          # valid inputs の例
          review_simple_changes: true
          max_files:            10
          system_message:       "You are a helpful AI code reviewer."
          language:             "jp"
