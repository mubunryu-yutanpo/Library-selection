openapi: 3.0.3
info:
  title: My API
  version: 1.0.0
servers:
  - url: http://localhost:8000/api
paths:
  /users:
    get:
      summary: ユーザー一覧取得
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: ユーザー作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
components:
  schemas:
    User:
      type: object
      properties:
        id:   { type: integer }
        name: { type: string }
        email:{ type: string }
      required: [id, name, email]
    UserCreate:
      type: object
      required: [name, email]
      properties:
        name:  { type: string }
        email: { type: string }
